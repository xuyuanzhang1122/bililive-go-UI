{
  "openapi": "3.0.3",
  "info": {
    "title": "录播播放 v2 第一期",
    "version": "2.0.0",
    "description": "管理接口仅 Bearer Key；会话 15 分钟，play_token 最长 5 分钟。GET 会话刷新授权；旧 token 仍受原过期、会话取消与资产身份复核约束。会话内存保存，进程重启失效；最多 1024 个且每用户 32 个。仅消费现有 T3/T4 有限准备；未配置且没有匹配资产明确失败，不隐式转换历史库。"
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/v2/recordings": {
      "get": {
        "operationId": "getV2Recordings",
        "summary": "读取后台已核验录播目录，按 ID 游标分页",
        "parameters": [
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          }
        ],
        "responses": {
          "200": {
            "description": "目录结果",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RecordingsEnvelope"
                }
              }
            }
          },
          "400": {
            "description": "请求无效",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "401": {
            "description": "缺少有效 Bearer Key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "403": {
            "description": "越权",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "404": {
            "description": "录播或会话不存在",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "409": {
            "description": "来源版本变化或录制中",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "410": {
            "description": "授权或会话过期",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "429": {
            "description": "会话容量已满",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "503": {
            "description": "目录或媒体探测暂不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        }
      }
    },
