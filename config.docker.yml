rpc:
  enable: true
  bind: :8080
security:
  # 给 iOS App 或外部客户端开放公网访问时建议改为 true，并填写 api_key。
  # Web UI 与移动端播放地址会使用 Authorization、_key 或签名 URL 访问受保护资源。
  enable_api_key: false
  api_key: ""
  signed_url_ttl_seconds: 3600
debug: false
interval: 20
out_put_path: /srv/bililive
app_data_path: /var/lib/bililive
# HLS 播放缓存生命周期配置
hls_cache:
  # HLS 播放缓存单个目录最大保留时长（小时），0 表示不按时间清理
  max_age_hours: 24
  # HLS 播放缓存总大小上限（GB），超出后按最久未使用淘汰，0 表示不限制
  max_total_size_gb: 10
read_only_tool_folder: /opt/bililive/tools
tool_root_folder: /srv/bililive/.appdata/tools
feature:
  use_native_flv_parser: false
live_rooms:

# 通知服务配置
notify:
  telegram:
    # 是否开启Telegram通知
    enable: false
    # 是否启用声音通知
    withNotification: true
    # Telegram机器人Token
    botToken: ""
    # Telegram聊天ID
    chatID: ""
  email:
    # 是否开启Email通知
    enable: false
    # SMTP服务器地址 (例如: smtp.gmail.com, smtp.qq.com等)
    smtpHost: "smtp.qq.com"
    # SMTP服务器端口 (常用端口: 25, 465, 587)
    smtpPort: 465
    # 发送者邮箱地址
    senderEmail: ""
    # 发送者邮箱授权码或应用专用密码
    senderPassword: ""
    # 接收者邮箱地址 
    recipientEmail: ""
  ntfy:
    enable: false
    URL: https://ntfy.sh/xxxx
    token: tk_xxxxxxxxx
    tag: new
