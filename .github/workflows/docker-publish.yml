name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag. Defaults to git describe output.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-publish.yml"

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Docker tags
        shell: bash
        env:
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
        run: |
          VERSION="$IMAGE_TAG_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --always)"
          fi
          {
            echo "VERSION=$VERSION"
            echo "DOCKER_TAGS=xuniubi/bililive-go:$VERSION,xuniubi/bililive-go:latest"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=gha,scope=xuniubi-bililive-go
          cache-to: type=gha,mode=max,scope=xuniubi-bililive-go
